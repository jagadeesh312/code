<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D IoT Model Viewer</title>
  <!-- Google Model Viewer component -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    model-viewer {
      width: 100vw;
      height: 100vh;
      --poster-color: transparent;
    }

    /* Floating UI Controls */
    .controls-panel {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      background: rgba(20, 20, 20, 0.75);
      padding: 10px 14px;
      border-radius: 40px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .btn {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <!-- 3D Model Viewer configured for model.glb -->
  <model-viewer 
    id="iot-viewer"
    src="model.glb" 
    alt="3D IoT Fish Farming Model" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1.5"
    shadow-softness="0.8"
    exposure="1.1"
    touch-action="none">
  </model-viewer>

  <!-- Control Buttons -->
  <div class="controls-panel">
    <button class="btn" onclick="zoomIn()">Zoom +</button>
    <button class="btn" onclick="zoomOut()">Zoom -</button>
    <button class="btn" onclick="toggleRotate()">Rotate</button>
    <button class="btn" onclick="resetView()">Reset</button>
  </div>

  <script>
    const viewer = document.querySelector('#iot-viewer');

    function zoomIn() {
      viewer.zoom(0.8);
    }

    function zoomOut() {
      viewer.zoom(-0.8);
    }

    function toggleRotate() {
      if (viewer.hasAttribute('auto-rotate')) {
        viewer.removeAttribute('auto-rotate');
      } else {
        viewer.setAttribute('auto-rotate', '');
      }
    }

    function resetView() {
      viewer.cameraOrbit = 'auto auto auto';
      viewer.fieldOfView = 'auto';
    }
  </script>

</body>
</html>
